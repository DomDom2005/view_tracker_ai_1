[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "view_tracker_ai_1"
version = "2.0.1"
description = "Interaktywna analiza liczników ofert Allegro: Streamlit + SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "plotly==7.1.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "streamlit==1.66.1",
    "tzdata==2026.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/view_tracker_ai_1"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
