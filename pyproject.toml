[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "view_tracker_ai_1"
version = "0.0.1"
description = "Historia i trendy liczników ofert Allegro: snapshoty, wykresy, komentarz AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.3.0",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "tzdata==2026.5",
]

[project.scripts]
view_tracker_ai_1 = "view_tracker_ai_1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/view_tracker_ai_1"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
